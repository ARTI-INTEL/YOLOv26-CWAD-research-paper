# Ultralytics YOLO26-CWAD object detection model with P2/4 - P5/32 outputs (4-scale head).
# CWAD-YOLO enhancements ported onto the native YOLO26 end-to-end framework:
#   - DKSCDown: dual-kernel (3x3/5x5) depthwise stride-2 downsampling with GAP+Softmax dynamic branch weighting,
#     replacing the backbone and neck stride-2 Conv layers.
#   - LightSDI: light semantics and detail infusion, depthwise/pointwise refinement + Hadamard product fusion,
#     replacing the neck Concat layers.
#   - Extra P2/4 prediction scale for small/distant objects.
#   - Wise-IoU v2 (IouLoss, dynamic focusing) box regression loss, wired in ultralytics/utils/loss.py BboxLoss.
# YOLO26 engine specifics retained: end-to-end NMS-free head, direct (X, Y, W, H) regression, reg_max=1 (no DFL).

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26-cwads.yaml' will call yolo26-cwad.yaml with scale 's'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, DKSCDown, [128]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, DKSCDown, [512]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, DKSCDown, [512]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, DKSCDown, [1024]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # Four-scale top-down path with LightSDI fusion
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, LightSDI, []] # 12 fuse backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, LightSDI, []] # 15 fuse backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # Extra P2/4 scale for small/distant objects
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 1], 1, LightSDI, []] # 18 fuse backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  # Bottom-up pathway
  - [-1, 1, DKSCDown, [128]] # 20 down P2 -> P3
  - [[-1, 16], 1, LightSDI, []] # 21 fuse head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8)

  - [-1, 1, DKSCDown, [256]] # 23 down P3 -> P4
  - [[-1, 13], 1, LightSDI, []] # 24 fuse head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [-1, 1, DKSCDown, [512]] # 26 down P4 -> P5
  - [[-1, 10], 1, LightSDI, []] # 27 fuse backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
